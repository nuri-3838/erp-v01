{% if dugum.cocuklar %}
<details class="ua-dugum"{% if derinlik < acik_seviye %} open{% endif %}>
  <summary>{% include "core/_urun_agaci_satir.html" %}</summary>
  {% for cocuk in dugum.cocuklar %}
    {% include "core/_urun_agaci_dugum.html" with dugum=cocuk derinlik=derinlik|add:1 %}
  {% endfor %}
</details>
{% else %}
<div class="ua-dugum ua-yaprak">{% include "core/_urun_agaci_satir.html" %}</div>
{% endif %}
