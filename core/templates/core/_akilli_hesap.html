{% comment %}
Ortak: select.akilli-sec öğelerini akıllı aramalı (filtreli açılır) hâle getirir.
Sayfa yüklenince mevcut tüm select.akilli-sec'ler otomatik bağlanır. Sonradan JS ile
eklenen satırlar (örn. "+ Kalem ekle") için window.akilliSecKur(selectEl) çağrılabilir.
{% endcomment %}
<script>
(function(){
  var gListe = document.querySelector('.akilli-liste');
  if(!gListe){ gListe = document.createElement('div'); gListe.className = 'akilli-liste';
    document.body.appendChild(gListe); }
  var aktifInp = null;
  function konumla(inp){ var r = inp.getBoundingClientRect();
    gListe.style.left = r.left+'px'; gListe.style.top = r.bottom+'px'; gListe.style.width = r.width+'px'; }
  function metin(sel, v){ var o = v ? sel.querySelector('option[value="'+CSS.escape(v)+'"]') : null;
    return o && o.value ? o.textContent.trim() : ''; }
  function ac(sel, inp, filt){
    aktifInp = inp; konumla(inp);
    filt = (filt||'').toLocaleLowerCase('tr'); gListe.innerHTML=''; var n=0;
    var kelimeler = filt.split(/\s+/).filter(Boolean);                       // sırasız çok kelimeli arama: TÜM kelimeler (kod/ad) geçmeli
    var bos = sel.options[0] && !sel.options[0].value ? sel.options[0].textContent.trim() : '— seç —';
    var sonGrup = null;
    Array.prototype.forEach.call(sel.options, function(o){
      var t = o.value ? o.textContent.trim() : bos;
      if(o.value && kelimeler.length){ var tl = t.toLocaleLowerCase('tr'); if(!kelimeler.every(function(k){ return tl.indexOf(k) > -1; })) return; }
      if(n++ > 80) return;
      if(o.parentNode && o.parentNode.tagName === 'OPTGROUP' && o.parentNode.label !== sonGrup){
        sonGrup = o.parentNode.label;
        var gb = document.createElement('div'); gb.className = 'akilli-grup'; gb.textContent = sonGrup;
        gListe.appendChild(gb);
      }
      var d = document.createElement('div'); d.className='akilli-secenek'; d.textContent=t; d.dataset.deger = o.value;
      d.addEventListener('mousedown', function(ev){ ev.preventDefault();
        sel.value=o.value; inp.value=o.value?t:''; gListe.style.display='none';
        sel.dispatchEvent(new Event('change', {bubbles:true})); });
      gListe.appendChild(d);
    });
    gListe.style.display = gListe.children.length ? 'block' : 'none';
  }
  function kur(sel){
    if(!sel || sel.classList.contains('akilli-gizli')) return;   // zaten bağlı — tekrar sarmalama
    var inp = document.createElement('input'); inp.type='text'; inp.className='akilli-girdi';
    inp.placeholder='ara / seç…';
    // "off" bazı Chrome sürümlerinde ödeme/adres/yük gibi kelimeler içeren etiketli
    // alanlarda yok sayılıyor — tarayıcı kendi öneri kutusunu açıp bizim listemizi
    // hemen kapatıyor ("açılıp hemen kapanıyor" hatası). "new-password" Chrome'un
    // gerçekten saygı gösterdiği tek değer.
    inp.autocomplete='new-password'; inp.setAttribute('data-lpignore', 'true');
    inp.setAttribute('data-1p-ignore', 'true');
    sel.parentNode.insertBefore(inp, sel); sel.classList.add('akilli-gizli');
    if(sel.value) inp.value = metin(sel, sel.value);
    inp.addEventListener('focus', function(){ ac(sel, inp, sel.value?'':inp.value); });
    inp.addEventListener('input', function(){ sel.value=''; ac(sel, inp, inp.value); });
    // Klavye: Enter liste açıkken vurgulu (yoksa ilk) seçeneği SEÇER ve formu ASLA göndermez (önceden Enter formu gönderiyor, seçim
    // kayboluyordu); ↑/↓ vurguyu gezdirir, Esc listeyi kapatır.
    inp.addEventListener('keydown', function(ev){
      var acik = gListe.style.display === 'block' && aktifInp === inp;
      if(ev.key === 'Enter'){
        ev.preventDefault();
        if(!acik) return;
        // vurgulu seçenek; yoksa metin yazılmışsa ilk GERÇEK eşleşme (boş "— seç —" satırı değil), metin boşsa ilk satır
        var vurgulu = gListe.querySelector('.akilli-secenek.vurgulu')
          || (inp.value ? gListe.querySelector('.akilli-secenek:not([data-deger=""])') : null)
          || gListe.querySelector('.akilli-secenek');
        if(vurgulu) vurgulu.dispatchEvent(new MouseEvent('mousedown', {bubbles: true, cancelable: true}));
      } else if(ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
        if(!acik){ ac(sel, inp, inp.value); return; }
        ev.preventDefault();
        var secenekler = Array.prototype.slice.call(gListe.querySelectorAll('.akilli-secenek'));
        if(!secenekler.length) return;
        var i = secenekler.findIndex(function(d){ return d.classList.contains('vurgulu'); });
        var y = ev.key === 'ArrowDown' ? Math.min(i + 1, secenekler.length - 1) : Math.max(i - 1, 0);
        secenekler.forEach(function(d){ d.classList.remove('vurgulu'); });
        secenekler[y].classList.add('vurgulu');
        if(secenekler[y].scrollIntoView) secenekler[y].scrollIntoView({block: 'nearest'});
      } else if(ev.key === 'Escape' && acik){
        ev.preventDefault(); gListe.style.display = 'none';
      }
    });
    inp.addEventListener('blur', function(){ setTimeout(function(){
      gListe.style.display='none'; inp.value=metin(sel, sel.value); }, 150); });
  }
  document.querySelectorAll('select.akilli-sec').forEach(kur);
  window.akilliSecKur = kur;   // dinamik eklenen satırlar için (satirEkle vb.)
  window.addEventListener('scroll', function(){ if(gListe.style.display==='block'&&aktifInp) konumla(aktifInp); }, true);
  window.addEventListener('resize', function(){ if(gListe.style.display==='block'&&aktifInp) konumla(aktifInp); });
})();
</script>
